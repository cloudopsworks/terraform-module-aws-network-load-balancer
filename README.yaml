description: |-
  This Terraform module creates and manages AWS Network Load Balancers (NLB) with comprehensive configuration options.
  Features include:
    - Support for both internal and external NLB deployments
    - IPv4 and dual-stack IP address types
    - Configurable deletion protection
    - Flexible subnet configuration (private/public)
    - Custom IP address assignment capability
    - Multiple listener configuration with TCP/TLS support
    - Cross-zone load balancing options
    - Integrated tagging system

# Introduction to the project
introduction: |-
  This module offers a comprehensive solution for AWS Network Load Balancer management with the following capabilities:
    - Dual-mode deployment supporting both internal and internet-facing configurations
    - Flexible naming with customizable prefixes for resource identification
    - IP address type selection (IPv4 or dual-stack)
    - Granular subnet control with support for both private and public subnets
    - Custom IP address assignment for network interface planning
    - Advanced listener configuration supporting TCP and TLS protocols
    - Optional cross-zone load balancing for improved availability
    - Deletion protection for production workloads
    - Extensible tagging system with environment-specific defaults

# How to use this project
usage: |-
  ## Variables

  Below is a summary of key variables that can be configured:

  - **is_hub** (bool): Identifies if this is a “hub” configuration. Defaults to `false`.
  - **spoke_def** (string): Identifier to distinguish spoke resources. Defaults to `"001"`.
  - **org** (object): Contains organizational settings (e.g., name, environment, etc.).
  - **extra_tags** (map(string)): Additional tags merged into resource tags.

  **NLB-Specific Variables**:
  - **is_internal** (bool): Whether the NLB is internal (`true`) or external (`false`). Defaults to `true` (internal).
  - **name_prefix** (string): Optional prefix for the load balancer name. Defaults to `""`.
  - **ip_address_type** (string): IP address type, e.g. `"ipv4"`. Defaults to `"ipv4"`.
  - **delete_protection** (bool): When `true`, prevents accidental deletion of the load balancer. Defaults to `true`.
  - **vpc_id** (string): The ID of the VPC where the load balancer will be provisioned.
  - **private_subnet_ids** (list(string)): List of private subnet IDs, if using an internal load balancer.
  - **public_subnet_ids** (list(string)): List of public subnet IDs, if using an external load balancer.
  - **public_ip_ids** (list(string)): List of EIP allocation IDs for public subnets, if applicable.
  - **private_ip_addresses** (list(string)): Private IP addresses to assign alongside subnet IDs.
  - **listener_config** (any): Map of listener blocks defining port, protocol, certificates, etc. Each entry references a target group ARN.
  - **enable_cross_zone** (bool): Enables cross-zone load balancing if set to `true`. Defaults to `false`.

  ## Using with Terragrunt

  When using Terragrunt, reference this module’s repository and specify inputs. For example:

  ```hcl
  terraform {
    # Points to the module source. Adjust the ref to the needed branch or tag.
    source = "git::git@github.com:cloudopsworks/terraform-module-aws-network-load-balancer.git?ref=develop"
  }

  include "root" {
    path = find_in_parent_folders()
  }

  # Dependencies on other modules, e.g. VPC, target groups, etc.
  dependency "vpc" {
    config_path = "../vpc"
  }

  dependency "target-group" {
    config_path = "../target-group"
  }

  inputs = {
    is_internal        = true
    name_prefix        = "example-nlb"
    vpc_id             = dependency.vpc.outputs.vpc_id
    private_subnet_ids = dependency.vpc.outputs.private_subnet_ids

    listener_config = {
      "listener1" = {
        port             = 80
        protocol         = "TCP"
        target_group_arn = dependency.target-group.outputs.tg_arn
      }
    }
  }
  ```

# Example usage
examples: |-
  ### Internal NLB with Multiple Listeners
  ```hcl
  terraform {
    source = "git::git@github.com:cloudopsworks/terraform-module-aws-network-load-balancer.git?ref=v1.0.0"
  }

  include "root" {
    path = find_in_parent_folders()
  }

  dependency "vpc" {
    config_path = "../vpc"
  }

  dependency "backend-services" {
    config_path = "../backend-services"
  }

  inputs = {
    org = {
      organization_unit = "myorg"
      environment_name = "prod"
      environment_type = "production"
    }

    is_internal = true
    name_prefix = "backend-nlb"
    vpc_id = dependency.vpc.outputs.vpc_id

    private_subnet_ids = dependency.vpc.outputs.private_subnets
    private_ip_addresses = [
      "10.0.1.10",
      "10.0.2.10"
    ]

    listener_config = {
      "http" = {
        port = 80
        protocol = "TCP"
        target_group_arn = dependency.backend-services.outputs.web_tg_arn
      }
      "https" = {
        port = 443
        protocol = "TLS"
        certificate_arn = "arn:aws:acm:region:account:certificate/cert-id"
        target_group_arn = dependency.backend-services.outputs.ssl_tg_arn
      }
    }

    enable_cross_zone = true
    delete_protection = true

    extra_tags = {
      Component = "Backend"
      Service = "API"
    }
  }
  ```

  ### External NLB with Public IPs
  ```hcl
  terraform {
    source = "git::git@github.com:cloudopsworks/terraform-module-aws-network-load-balancer.git?ref=v1.0.0"
  }

  include "root" {
    path = find_in_parent_folders()
  }

  dependency "vpc" {
    config_path = "../vpc"
  }

  dependency "frontend" {
    config_path = "../frontend"
  }

  inputs = {
    org = {
      organization_unit = "myorg"
      environment_name = "prod"
      environment_type = "production"
    }

    is_internal = false
    name_prefix = "public-nlb"
    vpc_id = dependency.vpc.outputs.vpc_id

    public_subnet_ids = dependency.vpc.outputs.public_subnets
    public_ip_ids = dependency.vpc.outputs.elastic_ips

    listener_config = {
      "web" = {
        port = 80
        protocol = "TCP"
        target_group_arn = dependency.frontend.outputs.web_tg_arn
      }
    }

    enable_cross_zone = true

    extra_tags = {
      Component = "Frontend"
      Access = "Public"
    }
  }
  ```

# How to get started quickly
quickstart: |-
  Follow these steps to quickly deploy an AWS Network Load Balancer:

  1. Prerequisites:
     - Existing VPC with appropriate subnets (public or private)
     - Target groups for your backend services
     - SSL certificates (if using TLS listeners)

  2. Create a new Terragrunt configuration:
     ```hcl
     # terragrunt.hcl
     terraform {
       source = "git::git@github.com:cloudopsworks/terraform-module-aws-network-load-balancer.git?ref=v1.0.0"
     }

     include "root" {
       path = find_in_parent_folders()
     }

     inputs = {
       org = {
         organization_unit = "myorg"
         environment_name = "dev"
         environment_type = "development"
       }

       is_internal = true
       vpc_id = "vpc-1234567890"
       private_subnet_ids = ["subnet-1234", "subnet-5678"]

       listener_config = {
         "app" = {
           port = 80
           protocol = "TCP"
           target_group_arn = "arn:aws:elasticloadbalancing:region:account:targetgroup/tg-name/tg-id"
         }
       }
     }
     ```

  3. Initialize and deploy:
     ```bash
     terragrunt init
     terragrunt plan    # Review the planned changes
     terragrunt apply   # Deploy the NLB
     ```

  4. Verify deployment:
     - Check AWS Console > EC2 > Load Balancers
     - Confirm listener configuration
     - Test connectivity through the NLB

  5. Next steps:
     - Configure DNS records pointing to the NLB
     - Monitor NLB metrics in CloudWatch
     - Set up health checks and alerts

